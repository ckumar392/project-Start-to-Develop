name: Python CI

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.py'
      - '**/requirements.txt'
      - '**/setup.py'
      - '**/pyproject.toml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/*.py'
      - '**/requirements.txt'
      - '**/setup.py'
      - '**/pyproject.toml'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install common dependencies
        pip install flake8 pytest
        
        # Look for requirements files in Python projects
        find . -name "requirements.txt" -type f | while read req_file; do
          project_dir=$(dirname "$req_file")
          echo "Installing requirements from: $req_file"
          pip install -r "$req_file" || echo "Failed to install requirements from $req_file, continuing..."
        done
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Test Python projects
      run: |
        echo "Looking for Python test files..."
        # Look for test files and run them
        if find . -name "test_*.py" -o -name "*_test.py" | head -1 | grep -q .; then
          pytest -v || echo "Some tests failed, but continuing workflow"
        else
          echo "No test files found, skipping tests"
        fi
        
        # Check if Python files can be imported
        find . -name "*.py" -path "*/PROJECTS/*" | head -5 | while read py_file; do
          echo "Checking syntax of: $py_file"
          python -m py_compile "$py_file" || echo "Syntax error in $py_file"
        done
        
        echo "Python workflow completed"