# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
    paths:
      - 'PROJECTS/SWIFT PROJECTS/**/*.swift'
      - 'PROJECTS/SWIFT PROJECTS/**/Package.swift'
      - 'PROJECTS/SWIFT PROJECTS/**/*.xcodeproj/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'PROJECTS/SWIFT PROJECTS/**/*.swift'
      - 'PROJECTS/SWIFT PROJECTS/**/Package.swift'
      - 'PROJECTS/SWIFT PROJECTS/**/*.xcodeproj/**'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Build Swift projects
      run: |
        echo "Looking for Swift projects..."
        cd "PROJECTS/SWIFT PROJECTS"
        
        # Look for Package.swift files (SPM projects)
        find . -name "Package.swift" -type f | while read package_file; do
          project_dir=$(dirname "$package_file")
          echo "Found Swift Package in: $project_dir"
          cd "$project_dir"
          swift build -v
          if swift test --help >/dev/null 2>&1; then
            swift test -v
          fi
          cd - >/dev/null
        done
        
        # Look for Xcode projects
        find . -name "*.xcodeproj" -type d | head -3 | while read xcode_project; do
          project_dir=$(dirname "$xcode_project")
          project_name=$(basename "$xcode_project" .xcodeproj)
          echo "Found Xcode project: $project_name in $project_dir"
          cd "$project_dir"
          
          # Try to build the project using xcodebuild
          if command -v xcodebuild >/dev/null 2>&1; then
            echo "Building $project_name..."
            xcodebuild -project "$xcode_project" -scheme "$project_name" -destination 'platform=iOS Simulator,name=iPhone 14' build || echo "Build failed for $project_name, continuing..."
          else
            echo "xcodebuild not available, skipping Xcode project build"
          fi
          cd - >/dev/null
        done
        
        echo "Swift workflow completed"
