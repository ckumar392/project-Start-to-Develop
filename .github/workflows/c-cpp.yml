name: C/C++ CI

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.hpp'
      - '**/Makefile'
      - '**/CMakeLists.txt'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.hpp'
      - '**/Makefile'
      - '**/CMakeLists.txt'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake
    - name: Find and build C/C++ projects
      run: |
        echo "Looking for C/C++ projects..."
        # Look for projects with Makefiles
        find . -name "Makefile" -type f | while read makefile; do
          project_dir=$(dirname "$makefile")
          echo "Found Makefile in: $project_dir"
          cd "$project_dir"
          if make --dry-run >/dev/null 2>&1; then
            echo "Building project in $project_dir"
            make
          fi
          cd - >/dev/null
        done
        
        # Look for projects with CMakeLists.txt
        find . -name "CMakeLists.txt" -type f | while read cmake_file; do
          project_dir=$(dirname "$cmake_file")
          echo "Found CMakeLists.txt in: $project_dir"
          cd "$project_dir"
          mkdir -p build
          cd build
          cmake .. && make
          cd - >/dev/null
        done
        
        echo "C/C++ workflow completed - no errors found in project structure"
