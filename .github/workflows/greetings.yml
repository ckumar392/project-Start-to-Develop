name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Thank you for opening your first issue! 🎉 This repository contains various development projects across multiple technologies. Please provide as much detail as possible to help us understand and address your issue."
        pr-message: "Thank you for your first pull request! 🚀 We appreciate your contribution to this multi-project repository. Please ensure your changes are well-tested and follow the coding standards for the specific technology you're working with."
